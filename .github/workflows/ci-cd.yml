name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t my-app .

      - name: Run Container (develop only)
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "Build only for develop"
          docker run --rm my-app

      - name: Run Container on port 82 (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          echo "Deploying on port 82"
          docker run -d -p 82:80 my-app
